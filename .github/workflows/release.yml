name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Import Apple signing certificate (macOS only)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "未設定 APPLE_CERTIFICATE,跳過 macOS 簽章設定(將產出未簽章包)"
            exit 0
          fi

          # 解碼 base64 → .p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12

          # 建立暫時 keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # 匯入憑證並開放 codesign 存取
          security import $RUNNER_TEMP/cert.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

          # 把簽章相關變數寫入 $GITHUB_ENV,讓後續 build step 自動繼承
          # (僅在 secret 真的有設時才寫入;未設時 build step 看不到這些 env,
          #  Tauri 不會嘗試 codesign,直接產出未簽章 .app/.dmg)
          {
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

          # 動態啟用 hardenedRuntime(公證需要)
          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json') as f: cfg = json.load(f)
          cfg.setdefault('bundle', {}).setdefault('macOS', {})['hardenedRuntime'] = True
          with open('src-tauri/tauri.conf.json', 'w') as f: json.dump(cfg, f, indent=2, ensure_ascii=False)
          "

      - name: Import Windows signing certificate (Windows only)
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "未設定 WINDOWS_CERTIFICATE,跳過 Windows 簽章設定(將產出未簽章包)"
            exit 0
          }

          # 解碼 base64 → .pfx
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)

          # 匯入到 CurrentUser\My
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          $thumbprint = $imported.Thumbprint
          Write-Host "Imported certificate thumbprint: $thumbprint"

          # 把 thumbprint 寫回 tauri.conf.json 的 bundle.windows.certificateThumbprint
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $thumbprint -Force
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath -Encoding UTF8

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 簽章/公證 env 由「Import Apple signing certificate」step 在
          # secret 真的有設時透過 $GITHUB_ENV 注入,這裡不再寫死(避免空字串
          # 觸發 codesign 卻找不到 identity 而失敗)。
        with:
          projectPath: ./src-tauri
          tagName: "${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-{1}', github.run_number, github.sha) }}"
          releaseName: "Auth 2FA ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          releaseBody: "請從下方資源下載對應作業系統的安裝包。"
          releaseDraft: ${{ github.ref_type == 'tag' }}
          prerelease: false
          args: ${{ matrix.args }}
