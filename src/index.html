<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth 2FA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 鎖定畫面 -->
    <section id="lock-screen" class="screen hidden">
      <div class="lock-card">
        <div class="logo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="logo-mark-shield" d="M12 2.75 19 5.6v5.8c0 4.5-2.83 8.18-7 9.85-4.17-1.67-7-5.35-7-9.85V5.6L12 2.75Z" />
            <rect class="logo-mark-panel" x="6.7" y="10.15" width="10.6" height="5.9" rx="2.1" />
            <circle class="logo-mark-dot logo-mark-dot-a" cx="9.2" cy="13.1" r="0.72" />
            <circle class="logo-mark-dot logo-mark-dot-b" cx="12" cy="13.1" r="0.72" />
            <circle class="logo-mark-dot logo-mark-dot-c" cx="14.8" cy="13.1" r="0.72" />
          </svg>
        </div>
        <h1 id="lock-title">Auth 2FA</h1>
        <p id="lock-subtitle" class="subtitle"></p>

        <form id="lock-form" autocomplete="off">
          <input
            id="password-input"
            type="password"
            data-i18n-placeholder="lock.placeholder.password"
            autocomplete="current-password"
            required
          />
          <input
            id="password-confirm"
            type="password"
            class="hidden"
            data-i18n-placeholder="lock.placeholder.confirm"
            autocomplete="new-password"
          />
          <button id="lock-submit" type="submit" class="btn btn-primary"></button>
        </form>
        <p id="lock-error" class="error-text"></p>
        <p class="hint" data-i18n="lock.hint"></p>

        <!-- 鎖定畫面語言切換 -->
        <div class="lang-inline" id="lock-lang-row"></div>
      </div>
    </section>

    <!-- 主畫面 -->
    <section id="main-screen" class="screen hidden">
      <header class="top-bar">
        <div class="top-bar-title">
          <span class="top-bar-logo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="logo-mark-shield" d="M12 2.75 19 5.6v5.8c0 4.5-2.83 8.18-7 9.85-4.17-1.67-7-5.35-7-9.85V5.6L12 2.75Z" />
              <rect class="logo-mark-panel" x="6.7" y="10.15" width="10.6" height="5.9" rx="2.1" />
              <circle class="logo-mark-dot logo-mark-dot-a" cx="9.2" cy="13.1" r="0.72" />
              <circle class="logo-mark-dot logo-mark-dot-b" cx="12" cy="13.1" r="0.72" />
              <circle class="logo-mark-dot logo-mark-dot-c" cx="14.8" cy="13.1" r="0.72" />
            </svg>
          </span>
          <h2 data-i18n="top.title">Authenticator</h2>
        </div>
        <div class="actions">
          <button id="btn-search-toggle" class="icon-btn"
                  data-i18n-attr="title:top.search,aria-label:top.search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
          <button id="btn-add" class="icon-btn"
                  data-i18n-attr="title:top.add,aria-label:top.add">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>

          <!-- 語言切換 -->
          <div class="lang-switcher">
            <button id="btn-lang" class="icon-btn"
                    data-i18n-attr="title:top.language,aria-label:top.language"
                    aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M2 12h20" />
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
              </svg>
            </button>
            <div class="lang-menu hidden" id="lang-menu" role="menu"></div>
          </div>

          <button id="btn-settings" class="icon-btn"
                  data-i18n-attr="title:top.settings,aria-label:top.settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9 1.65 1.65 0 0 0 4.27 7.18l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>

          <button id="btn-lock" class="icon-btn"
                  data-i18n-attr="title:top.lock,aria-label:top.lock">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </button>
        </div>
      </header>

      <section id="vault-overview" class="vault-overview" aria-live="polite"></section>

      <!-- 搜尋列(預設摺疊) -->
      <div id="search-bar" class="search-bar hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="search-input" type="text"
               data-i18n-placeholder="search.placeholder"
               autocomplete="off" />
        <button id="btn-search-clear" class="icon-btn" aria-label="clear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <ul id="account-list" class="account-list"></ul>
      <div id="search-empty" class="empty-state hidden">
        <p id="search-empty-text"></p>
      </div>
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-illustration">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="logo-mark-shield" d="M12 2.75 19 5.6v5.8c0 4.5-2.83 8.18-7 9.85-4.17-1.67-7-5.35-7-9.85V5.6L12 2.75Z" />
            <rect class="logo-mark-panel" x="6.7" y="10.15" width="10.6" height="5.9" rx="2.1" />
            <circle class="logo-mark-dot logo-mark-dot-a" cx="9.2" cy="13.1" r="0.72" />
            <circle class="logo-mark-dot logo-mark-dot-b" cx="12" cy="13.1" r="0.72" />
            <circle class="logo-mark-dot logo-mark-dot-c" cx="14.8" cy="13.1" r="0.72" />
          </svg>
        </div>
        <h3 data-i18n="empty.title"></h3>
        <p data-i18n="empty.body"></p>
        <button id="btn-add-empty" class="btn btn-primary" data-i18n="empty.button"></button>
      </div>
    </section>

    <!-- 新增帳戶 Modal -->
    <div id="modal-add" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <header class="modal-header">
          <h3 data-i18n="modal.title"></h3>
          <button class="icon-btn modal-close"
                  data-i18n-attr="aria-label:modal.close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </header>

        <div class="tab-bar">
          <button class="tab-btn active" data-tab="uri" data-i18n="modal.tab.uri"></button>
          <button class="tab-btn" data-tab="manual" data-i18n="modal.tab.manual"></button>
        </div>

        <div class="tab-content" data-tab-content="uri">
          <label data-i18n="modal.uri.label"></label>
          <textarea
            id="uri-input"
            rows="3"
            placeholder="otpauth://totp/Issuer:user@example.com?secret=BASE32&issuer=Issuer"
          ></textarea>
          <button id="btn-choose-qr" type="button" class="btn btn-ghost btn-with-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <line x1="14" y1="14" x2="14" y2="14.01"/>
              <line x1="14" y1="17" x2="17" y2="17"/>
              <line x1="14" y1="20" x2="14" y2="20.01"/>
              <line x1="17" y1="14" x2="17" y2="14.01"/>
              <line x1="17" y1="20" x2="17" y2="20.01"/>
              <line x1="20" y1="14" x2="20" y2="14.01"/>
              <line x1="20" y1="17" x2="20" y2="17"/>
              <line x1="20" y1="20" x2="20" y2="20.01"/>
            </svg>
            <span data-i18n="modal.uri.choose_image"></span>
          </button>
          <p class="hint" data-i18n="modal.uri.hint"></p>
        </div>

        <form class="tab-content hidden" data-tab-content="manual" id="manual-form">
          <label data-i18n="modal.field.name"></label>
          <input id="m-name" type="text" required />

          <label data-i18n="modal.field.secret"></label>
          <input id="m-secret" type="text" required />

          <label data-i18n="modal.field.kind"></label>
          <select id="m-kind">
            <option value="totp" selected data-i18n="modal.kind.totp"></option>
            <option value="hotp" disabled data-i18n="modal.kind.hotp"></option>
          </select>

          <details class="advanced">
            <summary data-i18n="modal.advanced"></summary>
            <label data-i18n="modal.field.issuer"></label>
            <input id="m-issuer" type="text" />

            <div class="row">
              <div class="col">
                <label data-i18n="modal.field.algorithm"></label>
                <select id="m-algorithm">
                  <option value="SHA1" selected>SHA1</option>
                  <option value="SHA256">SHA256</option>
                  <option value="SHA512">SHA512</option>
                </select>
              </div>
              <div class="col">
                <label data-i18n="modal.field.digits"></label>
                <select id="m-digits">
                  <option value="6" selected>6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
              </div>
              <div class="col">
                <label data-i18n="modal.field.period"></label>
                <input id="m-period" type="number" value="30" min="5" max="300" />
              </div>
            </div>
          </details>
        </form>

        <p id="modal-error" class="error-text"></p>

        <footer class="modal-footer">
          <button class="btn btn-ghost modal-close" type="button" data-i18n="modal.cancel"></button>
          <button id="btn-save" class="btn btn-primary" type="button" data-i18n="modal.save"></button>
        </footer>
      </div>
    </div>

    <!-- 編輯帳戶 Modal -->
    <div id="modal-edit" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <header class="modal-header">
          <h3 data-i18n="edit.title"></h3>
          <button class="icon-btn modal-edit-close" data-i18n-attr="aria-label:modal.close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </header>

        <div class="tab-content">
          <label data-i18n="edit.field.name"></label>
          <input id="edit-name" type="text" />

          <label data-i18n="edit.field.issuer"></label>
          <input id="edit-issuer" type="text" />
        </div>

        <p id="edit-error" class="error-text"></p>

        <footer class="modal-footer">
          <button class="btn btn-ghost modal-edit-close" type="button" data-i18n="modal.cancel"></button>
          <button id="btn-edit-save" class="btn btn-primary" type="button" data-i18n="edit.save"></button>
        </footer>
      </div>
    </div>

    <!-- 設定頁(獨立畫面) -->
    <section id="settings-screen" class="screen hidden">
      <header class="top-bar">
        <button id="btn-settings-back" class="icon-btn back-btn"
                data-i18n-attr="aria-label:modal.close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>
        <div class="top-bar-title top-bar-title-center">
          <h2 data-i18n="settings.title"></h2>
        </div>
        <div class="actions" aria-hidden="true">
          <span class="icon-btn invisible-spacer"></span>
        </div>
      </header>

      <div class="settings-page">
        <section class="settings-hero" aria-labelledby="settings-hero-title">
          <div class="settings-hero-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path class="logo-mark-shield" d="M12 2.75 19 5.6v5.8c0 4.5-2.83 8.18-7 9.85-4.17-1.67-7-5.35-7-9.85V5.6L12 2.75Z" />
              <rect class="logo-mark-panel" x="6.7" y="10.15" width="10.6" height="5.9" rx="2.1" />
              <circle class="logo-mark-dot logo-mark-dot-a" cx="9.2" cy="13.1" r="0.72" />
              <circle class="logo-mark-dot logo-mark-dot-b" cx="12" cy="13.1" r="0.72" />
              <circle class="logo-mark-dot logo-mark-dot-c" cx="14.8" cy="13.1" r="0.72" />
            </svg>
          </div>
          <div class="settings-hero-copy">
            <strong id="settings-hero-title" data-i18n="settings.hero.title"></strong>
            <span data-i18n="settings.hero.body"></span>
          </div>
          <span class="settings-hero-badge" data-i18n="settings.hero.badge"></span>
        </section>

        <section class="settings-section settings-section-appearance">
          <h4 data-i18n="settings.section.appearance"></h4>
          <div class="settings-row">
            <div class="settings-label-group">
              <label data-i18n="settings.theme.label"></label>
              <p class="settings-hint" data-i18n="settings.theme.hint"></p>
            </div>
            <select id="setting-theme">
              <option value="auto" data-i18n="settings.theme.auto"></option>
              <option value="light" data-i18n="settings.theme.light"></option>
              <option value="dark" data-i18n="settings.theme.dark"></option>
            </select>
          </div>
          <div class="settings-row">
            <div class="settings-label-group">
              <label data-i18n="settings.language.label"></label>
              <p class="settings-hint" data-i18n="settings.language.hint"></p>
            </div>
            <select id="setting-language"></select>
          </div>
        </section>

        <section class="settings-section settings-section-security">
          <h4 data-i18n="settings.section.security"></h4>
          <div class="settings-row">
            <div class="settings-label-group">
              <label data-i18n="settings.autolock.label"></label>
              <p class="settings-hint" data-i18n="settings.autolock.hint"></p>
            </div>
            <select id="setting-autolock">
              <option value="0" data-i18n="settings.autolock.off"></option>
              <option value="60" data-i18n="settings.autolock.1m"></option>
              <option value="300" data-i18n="settings.autolock.5m"></option>
              <option value="900" data-i18n="settings.autolock.15m"></option>
              <option value="1800" data-i18n="settings.autolock.30m"></option>
            </select>
          </div>
          <div class="settings-row settings-row-vertical">
            <div class="settings-row-inline">
              <div class="settings-label-group">
                <label data-i18n="settings.reveal.label"></label>
                <p class="settings-hint" data-i18n="settings.reveal.hint"></p>
              </div>
              <input id="setting-hide-codes" type="checkbox" class="toggle" />
            </div>
          </div>
          <div class="settings-row">
            <button id="btn-change-password" class="btn btn-ghost settings-action settings-action-secure" data-i18n="settings.change_password.button"></button>
          </div>
        </section>

        <section class="settings-section settings-section-backup">
          <h4 data-i18n="settings.section.backup"></h4>
          <div class="settings-row settings-row-vertical">
            <button id="btn-export" class="btn btn-ghost settings-action settings-action-export" data-i18n="settings.export.button"></button>
            <p class="settings-hint" data-i18n="settings.export.hint"></p>
          </div>
          <div class="settings-row">
            <button id="btn-import" class="btn btn-ghost settings-action settings-action-import" data-i18n="settings.import.button"></button>
          </div>
        </section>

        <section class="settings-section settings-section-about">
          <h4 data-i18n="settings.section.about"></h4>
          <div class="settings-about">
            <div class="logo logo-sm">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="logo-mark-shield" d="M12 2.75 19 5.6v5.8c0 4.5-2.83 8.18-7 9.85-4.17-1.67-7-5.35-7-9.85V5.6L12 2.75Z" />
                <rect class="logo-mark-panel" x="6.7" y="10.15" width="10.6" height="5.9" rx="2.1" />
                <circle class="logo-mark-dot logo-mark-dot-a" cx="9.2" cy="13.1" r="0.72" />
                <circle class="logo-mark-dot logo-mark-dot-b" cx="12" cy="13.1" r="0.72" />
                <circle class="logo-mark-dot logo-mark-dot-c" cx="14.8" cy="13.1" r="0.72" />
              </svg>
            </div>
            <div>
              <strong>Auth 2FA</strong>
              <p class="settings-hint" data-i18n="settings.about.tagline"></p>
              <p class="settings-hint" id="settings-version"></p>
            </div>
          </div>
        </section>
      </div>
    </section>

    <!-- 變更主密碼 Modal -->
    <div id="modal-changepw" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <header class="modal-header">
          <h3 data-i18n="changepw.title"></h3>
          <button class="icon-btn modal-changepw-close" data-i18n-attr="aria-label:modal.close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </header>

        <form id="changepw-form" class="tab-content" autocomplete="off">
          <label data-i18n="changepw.old"></label>
          <input id="cp-old" type="password" autocomplete="current-password" />

          <label data-i18n="changepw.new"></label>
          <input id="cp-new" type="password" autocomplete="new-password" />

          <label data-i18n="changepw.confirm"></label>
          <input id="cp-confirm" type="password" autocomplete="new-password" />
        </form>

        <p id="changepw-error" class="error-text"></p>

        <footer class="modal-footer">
          <button class="btn btn-ghost modal-changepw-close" type="button" data-i18n="modal.cancel"></button>
          <button id="btn-changepw-submit" class="btn btn-primary" type="button" data-i18n="changepw.button"></button>
        </footer>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="error-overlay.js"></script>
    <script src="i18n.js"></script>
    <script src="main.js"></script>
  </body>
</html>
