[package]
name = "auth-2fa"
version = "0.1.0"
description = "Auth 2FA — 桌面版雙因素驗證器"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/weimi89/Authenticator2FA"

[lib]
name = "auth_2fa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 密碼學
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
base32 = "0.5"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"

# URI 解析
url = "2"
percent-encoding = "2"

# QR Code 圖片解碼
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rqrr = "0.8"

# 工具
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
